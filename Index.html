<!DOCTYPE html>
<html lang="en">

<head>
 <meta charset="UTF-8">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Neo Tokyo WebGL Interface</title>
 <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
 <script src="https://cdn.tailwindcss.com"></script>
 <style>
  body { margin: 0; overflow: hidden; background: #010101; font-family: 'Inter', sans-serif; }
  canvas { display: block; }
  
  /* Custom Glow Class for the Neo Tokyo Asset */
  .icon-glow {
      box-shadow: 0 0 25px rgba(64, 54, 255, 0.6);
      background: linear-gradient(135deg, #064e3b 0%, #022c22 100%);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .icon-glow:hover {
      transform: scale(1.1);
      box-shadow: 0 0 35px rgba(167, 139, 250, 0.8);
  }
 </style>
</head>

<body>

 <!-- UI Overlay Layer -->
 <div class="fixed inset-0 z-10 pointer-events-none flex items-center justify-center">

  <!-- IconAsset Component Implementation -->
  <div class="pointer-events-auto relative">
   <div class="icon-glow w-32 h-32 relative flex items-center justify-center border-2 border-[#a78bfa]" style="border-radius: 8px;">
    <!-- Placeholder for the Neo Tokyo Skel Image -->
    <div class="w-full h-full overflow-hidden" style="border-radius: 8px;">
     <img src="logo.svg">
    </div>

    <!-- Dynamic Badge Notification -->
    <span class="absolute -top-2 -right-2 px-3 py-1 text-[10px] font-bold text-white rounded-full flex items-center justify-center min-w-[24px]" style="background-color: #0000ff; box-shadow: 0 0 10px #0000ff;">
     TIME
    </span>
   </div>

   <!-- Context Label -->
   <div class="mt-4 text-[#a78bfa] text-center text-xs tracking-widest uppercase font-black opacity-70">
    System Active
   </div>
  </div>
 </div>

 <script>
  // Scene Setup
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(window.devicePixelRatio);
  document.body.appendChild(renderer.domElement);
  
  // Enhanced Geometry to match Icon Style
  // Using a high-detail TorusKnot with a "Wireframe-Glow" look
  const geometry = new THREE.TorusKnotGeometry(1.2, 0.4, 150, 20);
  const material = new THREE.MeshStandardMaterial({ 
      color: 0x4036ff, 
      wireframe: true,
      transparent: true,
      opacity: 0.8,
      emissive: 0xa78bfa,
      emissiveIntensity: 0.5
  });
  const mesh = new THREE.Mesh(geometry, material);
  scene.add(mesh);
  
  // Lighting
  const ambientLight = new THREE.AmbientLight(0x404040, 2);
  scene.add(ambientLight);
  
  const pLight = new THREE.PointLight(0xa78bfa, 2);
  pLight.position.set(5, 5, 5);
  scene.add(pLight);
  
  const accentLight = new THREE.PointLight(0x0000ff, 2);
  accentLight.position.set(-5, -5, 2);
  scene.add(accentLight);
  
  camera.position.z = 5;
  
  // Mouse Interactivity
  let mouseX = 0;
  let mouseY = 0;
  document.addEventListener('mousemove', (e) => {
      mouseX = (e.clientX - window.innerWidth / 2) / 100;
      mouseY = (e.clientY - window.innerHeight / 2) / 100;
  });
  
  // Responsive Handling
  window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
  });
  
  function animate() {
      requestAnimationFrame(animate);
      
      // Subtle rotation and mouse-following drift
      mesh.rotation.x += 0.005;
      mesh.rotation.y += 0.008;
      
      mesh.position.x += (mouseX - mesh.position.x) * 0.05;
      mesh.position.y += (-mouseY - mesh.position.y) * 0.05;
  
      // Pulsing effect to match the "Time" badge feel
      const pulse = Math.sin(Date.now() * 0.002) * 0.1 + 0.9;
      mesh.scale.set(pulse, pulse, pulse);
  
      renderer.render(scene, camera);
  }
  animate();
 </script>
</body>

</html>
